<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="NPM3D home">
      <span class="brand-mark">NPM3D</span>
      <span class="brand-sub">Datasets &amp; Benchmarks</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>

    <nav id="main-nav" class="main-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}">Home</a>

      <details class="nav-dropdown">
        <summary>Datasets</summary>
        <div class="dropdown-panel">
          {% for dataset in site.data.datasets %}
          <a href="{{ dataset.path | relative_url }}">
            <span>{{ dataset.title }}</span>
            <small>{{ dataset.year }}</small>
          </a>
          {% endfor %}
        </div>
      </details>

      <a href="{{ site.group_url }}">Research group ↗</a>
    </nav>
  </div>
</header>
