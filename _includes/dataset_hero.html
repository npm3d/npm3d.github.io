<section class="dataset-hero">
  <div class="hero-copy">
    <span class="eyebrow">NPM3D dataset · {{ page.dataset_year }}</span>
    <h1>{{ page.title }}</h1>
    <p class="lede">{{ page.lede }}</p>
    <div class="hero-actions">
      <a class="button primary" href="#download">Download</a>
      {% if page.paper %}<a class="button" href="{{ page.paper }}">Paper ↗</a>{% endif %}
      {% if page.code %}<a class="button" href="{{ page.code }}">Code ↗</a>{% endif %}
    </div>
  </div>
  {% if page.hero_image %}
  <figure class="hero-media">
    <img src="{{ page.hero_image | relative_url }}"{% if page.legacy_hero_image %} data-fallback-src="{{ page.legacy_hero_image }}"{% endif %} alt="{{ page.hero_alt | default: page.title }}" loading="eager">
  </figure>
  {% endif %}
</section>
